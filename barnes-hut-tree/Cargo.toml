[package]
name = "barnes-hut-tree"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Morton-code Barnes-Hut tree for spatial force approximation."
categories = ["algorithms", "science"]
keywords = ["Barnes-Hut", "morton", "spatial", "quadtree", "force-approximation"]
repository = "https://github.com/frjnn/bhtsne"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
num-traits = { version = "0.2", default-features = false }
rayon = { version = "1", optional = true }

[features]
default = ["std", "parallel"]
std = ["num-traits/std"]
# rayon needs threads, so parallel implies std.
parallel = ["dep:rayon", "std"]

[dev-dependencies]
proptest = "1"
rand = "0.9"
